services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fittrack
      POSTGRES_PASSWORD: fittrack
      POSTGRES_DB: fittrack
    # 5433 en el host: el 5432 ya lo usa otro proyecto.
    ports: ['5433:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']

volumes:
  pgdata:
