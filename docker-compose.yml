name: fittrack

services:
  db:
    container_name: fittrack-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fittrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fittrack}
      POSTGRES_DB: ${POSTGRES_DB:-fittrack}
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fittrack}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    container_name: fittrack-api
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fittrack}:${POSTGRES_PASSWORD:-fittrack}@db:5432/${POSTGRES_DB:-fittrack}?schema=public
      JWT_SECRET: ${JWT_SECRET:?definir JWT_SECRET de 32 caracteres o más}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: '3100'
      # El subdominio de país sesga la búsqueda de OpenFoodFacts a ese mercado.
      # Con world.* buscar "Alpina" devuelve una marca francesa de pasta; con
      # co.* devuelve los 183 productos de la Alpina colombiana. Los códigos de
      # barras son globales y se resuelven igual desde cualquier subdominio.
      OFF_API_URL: ${OFF_API_URL:-https://co.openfoodfacts.org}
      # Solo en dev. `npm run check` corre ui:check y tabs:check seguidos, y
      # entre los dos gastan más de 5 llamadas a /auth: cada contexto nuevo de
      # Playwright pide /auth/me, que cae bajo el mismo límite. Con 5, tabs:check
      # se come un 429 y el comando falla por el entorno. El compose de
      # producción no pasa la variable: ahí rige el default de 5 cada 15 minutos.
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-100}
      # Lo mismo con /auth/forgot, que tiene su propio límite de 3. El probe
      # verifica que la respuesta no distinga entre una cuenta que existe y una
      # que no; con 3, la segunda corrida ve un 429 y lee esa diferencia como
      # una filtración. Producción tampoco pasa esta variable.
      FORGOT_RATE_LIMIT: ${FORGOT_RATE_LIMIT:-50}
      # Y el techo global, por lo mismo: las suites comparten IP con el limiter
      # y entre smoke y probe pasan los 100 pedidos del minuto.
      API_RATE_LIMIT: ${API_RATE_LIMIT:-2000}
      # Y el de /auth/reset, que el probe agota en dos corridas seguidas.
      RESET_RATE_LIMIT: ${RESET_RATE_LIMIT:-100}
    ports:
      - '3100:3100'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://localhost:3100/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  web:
    container_name: fittrack-web
    build:
      context: ./apps/web
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
