server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Headers de seguridad para las respuestas que sirve nginx. Los del API
  # viajan con helmet sobre las respuestas de /api/, que pasan por proxy.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # camera=(self): el escáner de códigos de barras usa getUserMedia. Con la
  # lista vacía el navegador se la niega también al propio origen.
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'" always;

  # El API queda detrás del mismo origen: el navegador nunca ve otro host, así
  # que no hace falta CORS ni configurar una URL de API en el build.
  location /api/ {
    proxy_pass http://api:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Los assets con hash en el nombre no cambian nunca; el index sí. `expires`
  # ya emite el Cache-Control: un `add_header` acá descartaría los headers de
  # seguridad del nivel server, que nginx solo hereda si el bloque no define
  # ninguno propio.
  location /assets/ {
    expires 1y;
  }

  # Las fuentes no llevan hash en el nombre, pero cambian cuando se decide
  # cambiar de tipografía, o sea casi nunca. Si alguna se reemplaza, renombrala.
  location /fonts/ {
    expires 1y;
  }

  # SPA: cualquier ruta desconocida devuelve el index y decide el cliente.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
