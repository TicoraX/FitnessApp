server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # El API queda detrás del mismo origen: el navegador nunca ve otro host, así
  # que no hace falta CORS ni configurar una URL de API en el build.
  location /api/ {
    proxy_pass http://api:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Los assets con hash en el nombre no cambian nunca; el index sí.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: cualquier ruta desconocida devuelve el index y decide el cliente.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
