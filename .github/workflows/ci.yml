name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://fittrack:fittrack@localhost:5433/fittrack?schema=public
  JWT_SECRET: clave-de-integracion-continua-no-usar-en-produccion
  PORT: '3100'
  # La suite registra varios usuarios seguidos; el default de 5/15min la
  # cortaría por la mitad. El probe hace lo propio contra /auth/forgot, que
  # lleva su propio límite de 3.
  AUTH_RATE_LIMIT: '500'
  FORGOT_RATE_LIMIT: '500'
  # El techo global es 100/min y las suites comparten IP con el limiter: entre
  # smoke (127 pedidos) y probe (68) lo pasan, y el resultado dependia de
  # cuantos cayeran en el mismo minuto.
  API_RATE_LIMIT: '2000'
  RESET_RATE_LIMIT: '500'

jobs:
  # Rápido y sin navegador: si esto falla, no vale la pena arrancar el resto.
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fittrack
          POSTGRES_PASSWORD: fittrack
          POSTGRES_DB: fittrack
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U fittrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci
      - run: npx prisma migrate reset --force
      - run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests unitarios
        run: npx jest
      - name: Seed del catálogo
        run: npm run seed
      - name: Levantar el API
        run: |
          npm run build
          node dist/main.js &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3100/api/v1/foods/search?q=x" || true)
            if [ "$code" = "401" ]; then exit 0; fi
            sleep 1
          done
          echo "el API no respondió a tiempo"; exit 1
      - name: Smoke end to end
        run: npm run smoke

      - name: Sonda de bordes
        run: npm run probe

  # Stack completo con navegador. Es el único que prueba lo que ve el usuario.
  e2e:
    runs-on: ubuntu-latest
    needs: api
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fittrack
          POSTGRES_PASSWORD: fittrack
          POSTGRES_DB: fittrack
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U fittrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Este job instala los dos paquetes y en la raíz no hay lockfile:
          # sin esta lista, setup-node no encuentra qué cachear y falla.
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Preparar el API
        working-directory: apps/api
        run: |
          npm ci
          npx prisma migrate reset --force
          npx prisma generate
          npm run seed
          npm run build
          node dist/main.js &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3100/api/v1/foods/search?q=x" || true)
            if [ "$code" = "401" ]; then exit 0; fi
            sleep 1
          done
          echo "el API no respondió a tiempo"; exit 1

      - name: Preparar la web
        working-directory: apps/web
        run: |
          npm ci
          npx tsc -b
          npx vite build
          npx playwright install --with-deps chromium

      - name: Pruebas E2E (UI, Tabs, Contraste)
        working-directory: apps/web
        run: |
          nohup npx vite --port 5177 --strictPort > /tmp/vite.log 2>&1 &
          VITE_PID=$!
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5177/ || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          npm run ui:check
          npm run tabs:check
          npm run contrast:check
          kill $VITE_PID || true

      # Cuando algo falla, la captura dice más que el stack trace.
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: apps/web/shots/
          if-no-files-found: ignore
